<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Millrod Swim Academy Administrator Login"
    />

    <title>Millrod Swim Academy | Admin Login</title>

    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <style>
      /* ==================================================
           RESET
        ================================================== */

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 24px;

        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;

        color: #17324d;

        background: linear-gradient(
          135deg,
          #eaf8ff 0%,
          #f7fcff 45%,
          #eef8fc 100%
        );
      }

      /* ==================================================
           BACKGROUND
        ================================================== */

      .background-decoration {
        position: fixed;

        inset: 0;

        overflow: hidden;

        pointer-events: none;

        z-index: 0;
      }

      .circle {
        position: absolute;

        border-radius: 50%;

        filter: blur(2px);

        opacity: 0.45;
      }

      .circle-one {
        width: 420px;

        height: 420px;

        top: -180px;

        left: -130px;

        background: rgba(8, 127, 193, 0.12);
      }

      .circle-two {
        width: 350px;

        height: 350px;

        right: -120px;

        bottom: -100px;

        background: rgba(6, 59, 115, 0.1);
      }

      /* ==================================================
           LOGIN WRAPPER
        ================================================== */

      .login-wrapper {
        position: relative;

        z-index: 1;

        width: 100%;

        max-width: 460px;
      }

      /* ==================================================
           LOGIN CARD
        ================================================== */

      .login-card {
        padding: 38px;

        border: 1px solid rgba(255, 255, 255, 0.85);

        border-radius: 26px;

        background: rgba(255, 255, 255, 0.96);

        box-shadow: 0 30px 80px rgba(6, 59, 115, 0.16);

        backdrop-filter: blur(12px);
      }

      /* ==================================================
           BRAND
        ================================================== */

      .brand {
        text-align: center;

        margin-bottom: 28px;
      }

      .brand-icon {
        width: 72px;

        height: 72px;

        margin: 0 auto 15px;

        display: grid;

        place-items: center;

        border-radius: 21px;

        color: #ffffff;

        background: linear-gradient(135deg, #063b73, #087fc1);

        box-shadow: 0 15px 30px rgba(8, 127, 193, 0.25);

        font-size: 30px;
      }

      .brand h1 {
        margin: 0;

        color: #063b73;

        font-size: 25px;

        font-weight: 900;
      }

      .brand p {
        margin: 7px 0 0;

        color: #71869a;

        font-size: 13px;
      }

      /* ==================================================
           SECURITY BADGE
        ================================================== */

      .security-badge {
        display: flex;

        align-items: center;

        gap: 10px;

        margin-bottom: 24px;

        padding: 12px 14px;

        border: 1px solid #d9eef8;

        border-radius: 13px;

        background: #f3fbff;

        color: #063b73;

        font-size: 12px;

        font-weight: 700;
      }

      .security-badge i {
        color: #087fc1;

        font-size: 16px;
      }

      /* ==================================================
           ERROR
        ================================================== */

      .error-message {
        display: flex;

        align-items: flex-start;

        gap: 10px;

        margin-bottom: 18px;

        padding: 13px 14px;

        border: 1px solid #f0c7c7;

        border-radius: 12px;

        background: #fff5f5;

        color: #a42626;

        font-size: 13px;

        font-weight: 650;
      }

      .error-message i {
        margin-top: 2px;
      }

      /* ==================================================
           FORM
        ================================================== */

      .form-group {
        margin-bottom: 18px;
      }

      .form-group label {
        display: block;

        margin-bottom: 7px;

        color: #17324d;

        font-size: 13px;

        font-weight: 800;
      }

      .input-wrapper {
        position: relative;
      }

      .input-wrapper > i {
        position: absolute;

        top: 50%;

        left: 15px;

        transform: translateY(-50%);

        color: #8aa0b1;

        pointer-events: none;
      }

      .form-control {
        width: 100%;

        height: 50px;

        padding: 0 15px 0 44px;

        border: 1px solid #d8e5ec;

        border-radius: 12px;

        outline: none;

        background: #fbfdfe;

        color: #17324d;

        font-size: 14px;

        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
      }

      .form-control:focus {
        border-color: #087fc1;

        background: #ffffff;

        box-shadow: 0 0 0 4px rgba(8, 127, 193, 0.1);
      }

      /* ==================================================
           LOGIN BUTTON
        ================================================== */

      .login-button {
        width: 100%;

        min-height: 52px;

        margin-top: 4px;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 9px;

        border: 0;

        border-radius: 13px;

        background: linear-gradient(135deg, #063b73, #087fc1);

        color: #ffffff;

        font-size: 14px;

        font-weight: 850;

        box-shadow: 0 12px 25px rgba(8, 127, 193, 0.2);

        cursor: pointer;

        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          opacity 0.2s ease;
      }

      .login-button:hover {
        transform: translateY(-1px);

        box-shadow: 0 16px 30px rgba(8, 127, 193, 0.26);
      }

      .login-button:active {
        transform: translateY(0);
      }

      .login-button:disabled {
        opacity: 0.65;

        cursor: wait;
      }

      /* ==================================================
           RETURN TO WEBSITE
        ================================================== */

      .back-to-website {
        width: 100%;

        min-height: 48px;

        margin-top: 12px;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 8px;

        border: 1px solid #d8e5ec;

        border-radius: 13px;

        background: #ffffff;

        color: #063b73;

        font-size: 13px;

        font-weight: 800;

        text-decoration: none;

        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease;
      }

      .back-to-website:hover {
        background: #f2faff;

        border-color: #b9dcea;

        color: #087fc1;

        transform: translateY(-1px);
      }

      /* ==================================================
           FOOTER
        ================================================== */

      .login-footer {
        margin-top: 24px;

        text-align: center;

        color: #8aa0b1;

        font-size: 11px;

        line-height: 1.6;
      }

      .login-footer i {
        color: #087fc1;

        margin-right: 4px;
      }

      /* ==================================================
           MOBILE
        ================================================== */

      @media (max-width: 520px) {
        body {
          padding: 15px;
        }

        .login-card {
          padding: 27px 21px;

          border-radius: 21px;
        }

        .brand-icon {
          width: 62px;

          height: 62px;

          font-size: 25px;
        }

        .brand h1 {
          font-size: 22px;
        }
      }
    </style>
  </head>

  <body>
    <!-- ==================================================
         BACKGROUND
    ================================================== -->

    <div class="background-decoration" aria-hidden="true">
      <div class="circle circle-one"></div>

      <div class="circle circle-two"></div>
    </div>

    <!-- ==================================================
         LOGIN
    ================================================== -->

    <main class="login-wrapper">
      <section class="login-card" aria-label="Administrator login">
        <!-- ==============================================
                 BRAND
            =============================================== -->

        <div class="brand">
          <div class="brand-icon">
            <i class="fas fa-water"></i>
          </div>

          <h1>Millrod Swim Academy</h1>

          <p>Administrator Portal</p>
        </div>

        <!-- ==============================================
                 SECURITY
            =============================================== -->

        <div class="security-badge">
          <i class="fas fa-shield-halved"></i>

          <span> Secure administrator access with email verification </span>
        </div>

        <!-- ==============================================
                 ERROR MESSAGE
            =============================================== -->

        {% if error %}

        <div class="error-message" role="alert">
          <i class="fas fa-circle-exclamation"></i>

          <span> {{ error }} </span>
        </div>

        {% endif %}

        <!-- ==============================================
                 LOGIN FORM
            =============================================== -->

        <form method="POST" action="/admin/login" autocomplete="on">
          <!-- USERNAME -->

          <div class="form-group">
            <label for="username"> Username </label>

            <div class="input-wrapper">
              <i class="fas fa-user"></i>

              <input
                type="text"
                id="username"
                name="username"
                class="form-control"
                placeholder="Enter your username"
                autocomplete="username"
                required
                autofocus
              />
            </div>
          </div>

          <!-- PASSWORD -->

          <div class="form-group">
            <label for="password"> Password </label>

            <div class="input-wrapper">
              <i class="fas fa-lock"></i>

              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
            </div>
          </div>

          <!-- LOGIN -->

          <button type="submit" class="login-button">
            <i class="fas fa-right-to-bracket"></i>

            Continue to Admin
          </button>
        </form>

        <!-- ==============================================
                 RETURN TO MAIN WEBSITE
            =============================================== -->

        <a href="/" class="back-to-website">
          <i class="fas fa-arrow-left"></i>

          Return to Main Website
        </a>

        <!-- ==============================================
                 FOOTER
            =============================================== -->

        <div class="login-footer">
          <div>
            <i class="fas fa-lock"></i>

            Protected administrator area
          </div>

          <div>Millrod Swim Academy</div>
        </div>
      </section>
    </main>

    <!-- ==================================================
         LOGIN LOADING
    ================================================== -->

    <script>
      document.querySelector("form")?.addEventListener("submit", function () {
        const button = this.querySelector(".login-button");

        if (!button) {
          return;
        }

        button.disabled = true;

        button.innerHTML = `

                        <i
                            class="fas fa-spinner fa-spin"
                        ></i>

                        Verifying...

                    `;
      });
    </script>
  </body>
</html>
